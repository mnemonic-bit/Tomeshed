name: Bug report
description: Report reproducible incorrect behavior in Tomeshed.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities here. Use private vulnerability reporting in the issue chooser. Use synthetic documents and remove private document contents, credentials, and personal paths from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Tomeshed version
      description: Use the page footer or GitHub Release version.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Podman
        - Docker Compose
        - Docker directly
        - Native Python
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host architecture and browser
      description: Include host operating system, amd64 or arm64 architecture, container engine if used, and browser version.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Document format
      options:
        - PDF
        - EPUB
        - DoclingDocument JSON
        - No document involved
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a synthetic document when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove passwords, cookies, tokens, private document contents, personal paths, and private source URLs.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, private document contents, and other sensitive data.
          required: true
