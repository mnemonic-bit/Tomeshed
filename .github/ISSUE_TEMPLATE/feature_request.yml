name: Feature request
description: Suggest a Tomeshed document library outcome.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the document library need without sharing private documents.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what should become possible and how to observe success.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Deployment and format context
      description: Include Tomeshed version, deployment method, host architecture, and PDF, EPUB, or DoclingDocument JSON format if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, private document contents, and other sensitive data.
          required: true
