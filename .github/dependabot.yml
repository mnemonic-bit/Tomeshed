version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
          time: "06:00"
          timezone: Europe/Berlin
      labels:
          - dependencies
      open-pull-requests-limit: 5
      groups:
          codeql-action:
              patterns:
                  - "github/codeql-action/*"

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: monthly
          time: "06:15"
          timezone: Europe/Berlin
      labels:
          - dependencies
      open-pull-requests-limit: 5
      # Review Python minor upgrades together with the lock and validation target.
      ignore:
          - dependency-name: python
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
